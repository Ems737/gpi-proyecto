services:
  db:
    image: mariadb:10.6
    container_name: bookstack_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - botnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5
      timeout: 5s

  bookstack:
    image: linuxserver/bookstack:25.07.2
    container_name: bookstack_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - APP_KEY=${APP_KEY}
      - APP_URL=http://localhost:6875
      - DB_HOST=db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_SSLMODE=DISABLED
      - DB_SSL_MODE=DISABLED
    ports:
      - "6875:80" # Asegúrate de que las comillas estén bien
    volumes:
      - bookstack_data:/config
    networks:
      - botnet

  postgres:
    image: postgres:11
    container_name: botpress_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: botpress
      POSTGRES_PASSWORD: botpress_password
      POSTGRES_DB: botpress_db
    volumes:
      - botpress_db_data:/var/lib/postgresql/data
    networks:
      - botnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botpress -d botpress_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  botpress:
    image: botpress/server:12.31.10
    container_name: botpress
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BP_PRODUCTION: false
      BP_HTTP_PORT: 3000
      EXTERNAL_URL: http://localhost:3000
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: botpress_db
      DATABASE_USER: botpress
      DATABASE_PASSWORD: botpress_password
      BOOKSTACK_BASEURL: http://bookstack:80
      BOOKSTACK_TOKEN_ID: ${BOOKSTACK_TOKEN_ID}
      BOOKSTACK_TOKEN_SECRET: ${BOOKSTACK_TOKEN_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/botpress/data
    networks:
      - botnet

  bridge:
    build: ./bridge
    container_name: googlechat_bridge
    restart: unless-stopped
    environment:
      - BP_BASE=http://botpress:3000
      - BOT_ID=googlechatbot
    ports:
      - "8080:8080"
    networks:
      - botnet
    depends_on:
      - botpress

networks:
  botnet:
    driver: bridge

volumes:
  db_data:
  bookstack_data:
  botpress_db_data:
